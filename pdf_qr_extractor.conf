# PDF QR Extractor Configuration
#
# Supported Platform:
# Ubuntu 20.04 LTS and later
#
# Socket Path
EXTRACTOR_SOCKET_PATH=/opt/pdf-qr-extractor/run/pdf_qr_extractor.sock #User Defined

# PDF Processing Limits
MAX_PDF_PAGES_FOR_QR_SCAN=2      #Max 10
MAX_PDF_QR_DECODE_KB_SIZE=512    #Max 1 MB
MAX_QR_DECODE_KB_SIZE=512        #Max 1 MB

# Performance
#WORKER_THREADS=3     #suggested to use Default value (daemon derived which is 80% of number of cores) or bit lower value.
REQUEST_TIMEOUT_MS=2000  #Max 3000

# Security
# IMPORTANT: Set this to the UID of the application user that will communicate
# with the extractor. Run 'id -u <username>' to find the correct value.
#ALLOWED_UID=<SET_BEFORE_INSTALL>

# Logging
LOG_LEVEL=INFO       #DEBUG/INFO/WARN
#CONSOLE_OUTPUT=TRUE    #Default FALSE
LOG_SIZE=10000000
LOG_FILE=/tmp/pdf_qr_extractor.log
